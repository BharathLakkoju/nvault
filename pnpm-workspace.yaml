# Two packages: the Next.js app at the repo root, and the standalone
# `envvault-cli` package in cli/ (published to npm). The CLI has no runtime
# dependency on the app — it imports the shared vault crypto from
# ../src/lib/crypto at build time and esbuild inlines it (see
# cli/esbuild.config.js).
packages:
  - "."
  - "cli"
onlyBuiltDependencies:
  - "@node-rs/argon2"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
allowBuilds:
  "@node-rs/argon2": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
