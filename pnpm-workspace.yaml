# Not a monorepo — this file only carries pnpm settings (there is no
# `packages:` key). Single application, single package.json.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  '@node-rs/argon2': true
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - unrs-resolver
  - "@node-rs/argon2"
  - esbuild
  - sharp
