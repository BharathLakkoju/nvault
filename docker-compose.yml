# Local development database only. Production runs on Vercel + a hosted
# Postgres (Neon); file blobs live in Postgres, so there is no object storage
# to run locally.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: envvault
      POSTGRES_PASSWORD: envvault
      POSTGRES_DB: envvault
    ports:
      - "5432:5432"
    volumes:
      - envvault-postgres-data:/var/lib/postgresql/data

volumes:
  envvault-postgres-data:
