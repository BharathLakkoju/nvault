name: CLI Tag Release

# When a release PR (branch release/cli-v*) merges to master, create git tag cli-vX.Y.Z.
# Tags pushed with the default GITHUB_TOKEN do not trigger other workflows (including
# tag-push publish). Secret NVAULT_RELEASE_TOKEN (PAT with contents: write) is required
# to push the tag so "Publish CLI" runs on push.

on:
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: cli-tag-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # workflow_dispatch Publish CLI via GITHUB_TOKEN

jobs:
  skip:
    if: >-
      github.event.pull_request.merged != true ||
      !startsWith(github.event.pull_request.head.ref, 'release/cli-v')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Not a merged CLI release PR; no tag created."

  tag:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/cli-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Resolve version from branch name
        id: meta
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          VERSION="${HEAD_REF#release/cli-v}"
          if ! node --experimental-strip-types scripts/cli-bump-version.ts resolve \
            --current "$VERSION" --bump patch >/dev/null; then
            echo "Invalid version in branch name: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=cli-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify cli/package.json matches release branch
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./cli/package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "cli/package.json is $PKG_VERSION but release branch implies $VERSION" >&2
            exit 1
          fi

      - name: Create tag if missing
        id: tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping" >&2
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "CLI release ${TAG#cli-v}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.tag.outputs.created == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          NVAULT_RELEASE_TOKEN: ${{ secrets.NVAULT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NVAULT_RELEASE_TOKEN:-}" ]; then
            echo "ERROR: NVAULT_RELEASE_TOKEN is required to push the release tag." >&2
            echo "Tags pushed with GITHUB_TOKEN do not trigger other workflows (including Publish CLI)." >&2
            echo "Add a fine-grained PAT with contents:write as repository secret NVAULT_RELEASE_TOKEN." >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${NVAULT_RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "$TAG"

      - name: Trigger Publish CLI if not on npm
        if: steps.meta.outputs.tag != ''
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#cli-v}"
          PUBLISHED="$(npm view "@lbharath/nvault@${VERSION}" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "@lbharath/nvault@${VERSION} is already on npm; not dispatching Publish CLI." >&2
            exit 0
          fi
          echo "Dispatching Publish CLI for tag $TAG (npm does not have $VERSION yet)." >&2
          gh workflow run cli-release.yml --ref "$TAG"
