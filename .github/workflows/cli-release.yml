name: Release CLI

# Triggered by pushing a tag like `cli-v0.1.0` — scoped to the CLI
# specifically (as opposed to a web/api deploy) since this is a monorepo
# with independently versioned apps.
on:
  push:
    tags:
      - "cli-v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @envvault/types --filter @envvault/crypto run build

      - name: Bundle CLI (esbuild)
        working-directory: apps/cli
        run: pnpm run build

      - name: Run CLI unit tests
        working-directory: apps/cli
        run: pnpm run test

      # pkg cross-compiles all four targets from this single Linux runner —
      # no macOS/Windows runners needed (verified in development: `file`
      # confirms each output is a correctly-formatted ELF/Mach-O/PE binary).
      - name: Build standalone binaries
        working-directory: apps/cli
        run: node build-binaries.js

      - name: Smoke test the linux binary
        working-directory: apps/cli
        run: |
          chmod +x binaries/envvault-linux-x64
          ./binaries/envvault-linux-x64 --version

      - name: Checksums
        working-directory: apps/cli/binaries
        run: sha256sum envvault-* > SHA256SUMS.txt

      - name: Publish to npm
        working-directory: apps/cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/cli/binaries/*
          generate_release_notes: true

  # Best-effort MSI build via WiX on a Windows runner. This job is
  # intentionally separate and allowed to fail (see continue-on-error
  # below) — it has NOT been exercised end-to-end (this repo was built in
  # a Linux sandbox with no Windows/WiX toolchain available to test
  # against). The .exe from build-and-release above is the verified,
  # zero-install-required Windows artifact; treat this as a bonus until
  # someone has confirmed it produces a working installer.
  build-msi:
    runs-on: windows-latest
    needs: build-and-release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download the win-x64 binary from the release
        run: gh release download ${{ github.ref_name }} -p "envvault-win-x64.exe" -D .
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Build MSI
        shell: pwsh
        run: |
          # github.ref_name is e.g. "cli-v0.1.0" — MSI Package/@Version must
          # be a bare numeric "major.minor.build" (max 4 parts).
          $msiVersion = "${{ github.ref_name }}" -replace '^cli-v', ''
          wix build packaging/windows/envvault.wxs `
            -d ExePath="envvault-win-x64.exe" `
            -d Version="$msiVersion" `
            -out envvault-win-x64.msi
      - name: Upload MSI to the release
        uses: softprops/action-gh-release@v2
        with:
          files: envvault-win-x64.msi
