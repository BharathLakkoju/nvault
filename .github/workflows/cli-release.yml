name: Publish CLI

# Publishes the `envvault-cli` npm package from cli/ when a tag matching
# `cli-v*` is pushed (e.g. `cli-v0.1.0`). The tag version must match
# cli/package.json's "version". (The package is `envvault-cli`; the binary
# it installs is still `envvault`.)
#
# Requires a repository secret `NPM_TOKEN` — an npm **automation** or
# **granular** access token (npmjs.com → Access Tokens) that is allowed to
# publish `envvault-cli`. The very first publish also needs the token to be
# permitted to *create* new packages (granular tokens: give it access to
# "All packages", or use a classic Automation token).
#
# npm trusted publishing (OIDC) is intentionally NOT used: it can only be
# configured after a package already exists, so the initial release must go
# out with a token. Provenance is still attested via the workflow's OIDC
# identity (id-token: write) — that only needs `--provenance`, not a
# trusted-publisher token exchange.

on:
  push:
    tags:
      - "cli-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - name: Check NPM_TOKEN is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is not set. Create an npm access token" \
                 "with publish rights (and new-package creation for the first release) and add" \
                 "it under Settings → Secrets and variables → Actions as NPM_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches cli/package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p "require('./cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $TAG_VERSION but cli/package.json is $PKG_VERSION" >&2
            exit 1
          fi

      - run: pnpm --filter envvault-cli typecheck
      - run: pnpm --filter envvault-cli test
      - run: pnpm --filter envvault-cli build

      # Publish with npm (not `pnpm publish`): npm reliably authenticates via
      # the .npmrc that setup-node wrote from NODE_AUTH_TOKEN and does not
      # attempt the trusted-publishing OIDC token exchange that pnpm tries
      # first. The build already ran above, so lifecycle scripts are skipped.
      - name: Publish to npm
        working-directory: cli
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
