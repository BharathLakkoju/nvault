name: Publish CLI

# Publishes the `@lbharath/nvault` npm package from cli/ when a tag matching
# `cli-v*` is pushed (e.g. `cli-v0.1.0`). The tag version must match
# cli/package.json's "version". (The package is `envvault-cli`; the binary
# it installs is still `envvault`.)
#
# Auth is via npm Trusted Publishing (OIDC) — no token. Configure a trusted
# publisher for the `@lbharath/nvault` package on npmjs.com (Settings →
# Trusted Publisher) pointing at this repo + workflow file. The first ever publish
# must be done once manually (npm won't let you configure a trusted
# publisher for a package that doesn't exist yet); every release after that
# runs here tokenless. Provenance is attested from the workflow's OIDC
# identity (id-token: write).

on:
  push:
    tags:
      - "cli-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance + Trusted Publishing (OIDC)

    steps:
      - name: Check NPM_TOKEN is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is not set. Create an npm access token" \
                 "with publish rights (and new-package creation for the first release) and add" \
                 "it under Settings → Secrets and variables → Actions as NPM_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches cli/package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p "require('./cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $TAG_VERSION but cli/package.json is $PKG_VERSION" >&2
            exit 1
          fi

      - run: pnpm --filter ./cli typecheck
      - run: pnpm --filter ./cli test
      - run: pnpm --filter ./cli build

      # Tokenless: pnpm performs the npm OIDC token exchange automatically
      # because id-token:write is granted and a trusted publisher is
      # configured for `nvault` on npmjs.com.
      - name: Publish to npm
        run: pnpm --filter ./cli publish --no-git-checks --access public --provenance
