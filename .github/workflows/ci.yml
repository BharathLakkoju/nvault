name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: envvault
          POSTGRES_PASSWORD: envvault
          POSTGRES_DB: envvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envvault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://envvault:envvault@localhost:5432/envvault?schema=public
      DIRECT_DATABASE_URL: postgresql://envvault:envvault@localhost:5432/envvault?schema=public
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      STORAGE_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 24.9+: Jest resolves Prisma 7's internal dynamic import() and the
          # ESM-only `jose` package via native require(esm) (see the
          # --experimental-vm-modules flag on the test:integration script).
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm typecheck

      - run: pnpm typecheck:test

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm prisma migrate deploy

      - run: pnpm test:integration

      # CLI ⇄ API ⇄ Postgres: the real cli/ command functions against the real
      # Route Handlers. Reuses the same Postgres service + env as test:integration.
      - run: pnpm test:cli:integration

      - run: pnpm build

      # Standalone CLI package (cli/) — independent typecheck, tests, bundle.
      - run: pnpm --filter ./cli typecheck

      - run: pnpm --filter ./cli test

      - run: pnpm --filter ./cli build

  cli-npm-publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install npm (publish bin validation)
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
          node --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./cli build

      - name: npm publish dry-run keeps nvault bin
        working-directory: cli
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          if ! npm publish --dry-run --provenance=false --ignore-scripts 2>&1 | tee "$LOG"; then
            if grep -q 'cannot publish over the previously published versions' "$LOG" \
              && grep -q 'Tarball Contents' "$LOG"; then
              echo "Dry-run rejected republishing an existing version; tarball preview is sufficient."
            else
              echo "npm publish --dry-run failed" >&2
              exit 1
            fi
          fi
          if grep -qiE 'invalid and removed|auto-corrected' "$LOG"; then
            echo "::error::npm would strip or rewrite the bin entry" >&2
            grep -iE 'invalid and removed|auto-corrected' "$LOG" >&2
            exit 1
          fi
          PACKED="$(npm pack --silent)"
          cleanup() { rm -f "$PACKED"; }
          trap cleanup EXIT
          BIN="$(tar -xOf "$PACKED" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).bin.nvault")"
          if [ "$BIN" != "bin/nvault.js" ]; then
            echo "::error::packed package.json bin.nvault is '$BIN', expected 'bin/nvault.js'" >&2
            exit 1
          fi
          echo "packed bin.nvault=$BIN"
